
      - name: Diagnosticar AndroidManifest
        run: |
          echo "BUSCANDO EL MANIFEST"
          ls -l app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          try:
              ET.parse("app/src/main/AndroidManifest.xml")
              print("XML CORRECTO")
          except Exception as e:
              print("ERROR EXACTO:", e)
              raise
          PY
